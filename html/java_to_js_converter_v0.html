<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java → JS Converter</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --surface2: #1c1c22;
    --border: #2a2a35;
    --accent: #f0c040;
    --accent2: #40c0f0;
    --text: #e8e8f0;
    --muted: #6a6a80;
    --error: #f05070;
    --success: #50d090;
    --java: #f8901a;
    --js: #f0db4f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo .java-col { color: var(--java); }
  .logo .arrow { color: var(--muted); margin: 0 4px; }
  .logo .js-col { color: var(--js); }

  .subtitle {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr auto;
    gap: 0;
    padding: 0;
    height: calc(100vh - 81px);
  }

  .panel {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    min-height: 0;
  }

  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
  }

  .lang-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .badge-java { background: rgba(248,144,26,0.15); color: var(--java); border: 1px solid rgba(248,144,26,0.3); }
  .badge-js   { background: rgba(240,219,79,0.12); color: var(--js);   border: 1px solid rgba(240,219,79,0.25); }

  .panel-title {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    resize: none;
    tab-size: 2;
    direction: ltr;
    text-align: left;
  }
  textarea::placeholder { color: var(--muted); direction: ltr; text-align: left; }

  .output-area {
    flex: 1;
    background: var(--bg);
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    min-height: 0;
    direction: ltr;
    text-align: left;
  }

  .output-area .keyword   { color: #c792ea; }
  .output-area .string    { color: #c3e88d; }
  .output-area .comment   { color: #546e7a; font-style: italic; }
  .output-area .number    { color: #f78c6c; }
  .output-area .fn        { color: #82aaff; }
  .output-area .const-kw  { color: #f07178; }

  .action-bar {
    grid-column: 1 / -1;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .convert-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 10px 28px;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .convert-btn:hover { background: #ffd060; transform: translateY(-1px); }
  .convert-btn:active { transform: translateY(0); }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 6px 14px;
    border-radius: 5px;
    border: 1px solid transparent;
    display: none;
  }
  .status.ok    { display: block; color: var(--success); border-color: rgba(80,208,144,0.3); background: rgba(80,208,144,0.07); }
  .status.err   { display: block; color: var(--error);   border-color: rgba(240,80,112,0.3); background: rgba(240,80,112,0.07); }
  .status.warn  { display: block; color: var(--accent);  border-color: rgba(240,192,64,0.3); background: rgba(240,192,64,0.07); }

  /* Rules editor */
  .rules-toggle {
    margin-right: auto;
  }

  .rules-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .rules-panel.open { display: flex; }

  .rules-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: min(700px, 95vw);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .rules-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .rules-head h2 { font-size: 1rem; font-weight: 700; }

  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .close-btn:hover { color: var(--text); }

  .rules-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rule-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: center;
  }

  .rule-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .rule-input:focus { border-color: var(--accent2); }

  .del-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--error);
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.15s;
  }
  .del-btn:hover { background: rgba(240,80,112,0.1); border-color: var(--error); }

  .rules-foot {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
  }

  .rules-note {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .rule-section {
    margin-top: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .rule-section-title {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
  }

  .column-labels {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 6px;
    padding: 0 2px;
  }
  .col-label {
    font-size: 0.66rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.5px;
  }

  .add-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--accent2);
    padding: 7px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    transition: all 0.15s;
    width: 100%;
    text-align: center;
    margin-top: 4px;
  }
  .add-btn:hover { border-color: var(--accent2); background: rgba(64,192,240,0.06); }

  .stats {
    display: flex;
    gap: 20px;
    margin-right: 10px;
  }
  .stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .stat span { color: var(--accent2); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">
      <span class="java-col">Java</span>
      <span class="arrow">→</span>
      <span class="js-col">JS</span>
      <span style="color:var(--muted);font-weight:400;font-size:1rem"> Converter</span>
    </div>
    <div class="subtitle">כלי המרה חכם למתכנתים · מבוסס מילון כללים הניתן לעריכה</div>
  </div>
</header>

<div class="main">
  <div class="panel">
    <div class="panel-header">
      <span class="lang-badge badge-java">JAVA</span>
      <span class="panel-title">הכנס קוד Java כאן</span>
      <div class="btn-row">
        <button class="icon-btn" onclick="clearInput()">✕ נקה</button>
        <button class="icon-btn" onclick="loadExample()">⬇ דוגמה</button>
      </div>
    </div>
    <textarea id="javaInput" placeholder="// הדבק כאן קוד Java...&#10;public int myMethod(int x) {&#10;  System.out.println(x);&#10;  return x;&#10;}"></textarea>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="lang-badge badge-js">JS</span>
      <span class="panel-title">קוד JavaScript מומר</span>
      <div class="btn-row">
        <button class="icon-btn" onclick="copyOutput()">⎘ העתק</button>
      </div>
    </div>
    <div class="output-area" id="jsOutput">// קוד JavaScript יופיע כאן לאחר המרה...</div>
  </div>

  <div class="action-bar">
    <button class="convert-btn" onclick="convert()">⚡ המר</button>

    <div id="status" class="status"></div>

    <div class="stats" id="stats" style="display:none">
      <div class="stat">שורות: <span id="statLines">0</span></div>
      <div class="stat">החלפות: <span id="statReplacements">0</span></div>
    </div>

    <button class="icon-btn rules-toggle" onclick="openRules()">⚙ ערוך כללי המרה</button>
  </div>
</div>

<!-- Rules Modal -->
<div class="rules-panel" id="rulesPanel">
  <div class="rules-box">
    <div class="rules-head">
      <h2>⚙ כללי המרה</h2>
      <button class="close-btn" onclick="closeRules()">✕</button>
    </div>
    <div class="rules-body" id="rulesBody"></div>
    <div class="rules-foot">
      <div class="rules-note">* regex = ביטוי רגולרי | replacement = תחליף (תומך ב-$1, $2...)</div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" onclick="resetRules()">↺ אפס לברירת מחדל</button>
        <button class="convert-btn" style="padding:8px 20px" onclick="saveAndClose()">שמור וסגור</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  מילון כללי המרה — ניתן להרחבה מלאה
// ============================================================
const DEFAULT_RULES = {

  // ── 1. הסרת מילות Java שאין להן מקבילה בJS ──────────────
  removals: [
    { label: "הסר 'public'",     regex: "\\bpublic\\s+",           replacement: "" },
    { label: "הסר 'private'",    regex: "\\bprivate\\s+",          replacement: "" },
    { label: "הסר 'protected'",  regex: "\\bprotected\\s+",        replacement: "" },
    { label: "הסר 'static'",     regex: "\\bstatic\\s+",           replacement: "" },
    { label: "הסר 'final'",      regex: "\\bfinal\\s+",            replacement: "" },
    { label: "הסר 'abstract'",   regex: "\\babstract\\s+",         replacement: "" },
    { label: "הסר '@Override'",  regex: "@Override\\s*",           replacement: "" },
  ],

  // ── 2. המרת סוגי נתונים בהצהרות ──────────────────────────
  types: [
    { label: "int x → let x",      regex: "\\bint\\s+(\\w)",       replacement: "let $1" },
    { label: "double x → let x",   regex: "\\bdouble\\s+(\\w)",    replacement: "let $1" },
    { label: "float x → let x",    regex: "\\bfloat\\s+(\\w)",     replacement: "let $1" },
    { label: "long x → let x",     regex: "\\blong\\s+(\\w)",      replacement: "let $1" },
    { label: "char x → let x",     regex: "\\bchar\\s+(\\w)",      replacement: "let $1" },
    { label: "byte x → let x",     regex: "\\bbyte\\s+(\\w)",      replacement: "let $1" },
    { label: "short x → let x",    regex: "\\bshort\\s+(\\w)",     replacement: "let $1" },
    { label: "boolean x → let x",  regex: "\\bboolean\\s+(\\w)",   replacement: "let $1" },
    { label: "String x → let x",   regex: "\\bString\\s+(\\w)",    replacement: "let $1" },
    { label: "void פונקציה",       regex: "\\bvoid\\s+(\\w)",      replacement: "function $1" },
    { label: "int[] → let",        regex: "\\bint\\[\\]\\s+(\\w)", replacement: "let $1" },
    { label: "boolean[] → let",    regex: "\\bboolean\\[\\]\\s+(\\w)", replacement: "let $1" },
    { label: "String[] → let",     regex: "\\bString\\[\\]\\s+(\\w)", replacement: "let $1" },
  ],

  // ── 3. המרת מתודות ── ─────────────────────────────────────
  methods: [
    { label: "System.out.println → console.log",  regex: "System\\.out\\.println",  replacement: "console.log" },
    { label: "System.out.print → console.log",    regex: "System\\.out\\.print\\b", replacement: "console.log" },
    { label: "System.err.println → console.error",regex: "System\\.err\\.println",  replacement: "console.error" },
    { label: "Math.floor → Math.floor",           regex: "\\bMath\\.floor",         replacement: "Math.floor" },
    { label: "Math.abs → Math.abs",               regex: "\\bMath\\.abs",           replacement: "Math.abs" },
    { label: "Math.max → Math.max",               regex: "\\bMath\\.max",           replacement: "Math.max" },
    { label: "Math.min → Math.min",               regex: "\\bMath\\.min",           replacement: "Math.min" },
    { label: ".length() → .length",               regex: "\\.length\\(\\)",         replacement: ".length" },
    { label: ".size() → .length",                 regex: "\\.size\\(\\)",           replacement: ".length" },
    { label: ".equals() → ===",                   regex: "\\.equals\\(([^)]+)\\)",  replacement: " === $1" },
    { label: "new ArrayList → []",                regex: "new ArrayList<[^>]*>\\(\\)", replacement: "[]" },
    { label: "new HashMap → {}",                  regex: "new HashMap<[^>]*>\\(\\)",  replacement: "{}" },
    { label: "new boolean[x] → Array(x).fill", regex: "new boolean\\[([^\\]]+)\\]", replacement: "new Array($1).fill(false)" },
    { label: "new int[x] → Array(x).fill(0)", regex: "new int\\[([^\\]]+)\\]",     replacement: "new Array($1).fill(0)" },
  ],

  // ── 4. המרת מבני שפה ──────────────────────────────────────
  syntax: [
    { label: "new Error()",       regex: "new IllegalArgumentException", replacement: "new Error" },
    { label: "throw Error",       regex: "throw new IllegalArgumentException", replacement: "throw new Error" },
    { label: "!= → !==",         regex: "\\s!=\\s",     replacement: " !== " },
    { label: "== → ===",          regex: "\\s==\\s",     replacement: " === " },
    { label: "true/false literals", regex: "\\btrue\\b",  replacement: "true" },
  ],

  // ── 5. פורמט פונקציה ──────────────────────────────────────
  functions: [
    { label: "int methodName( → function methodName(",  regex: "\\bint\\s+(\\w+)\\s*\\(",   replacement: "function $1(" },
    { label: "boolean method( → function method(",      regex: "\\bboolean\\s+(\\w+)\\s*\\(", replacement: "function $1(" },
    { label: "String method( → function method(",       regex: "\\bString\\s+(\\w+)\\s*\\(",  replacement: "function $1(" },
    { label: "הסר סוגי פרמטרים",  regex: "\\b(?:int|double|float|long|char|boolean|String)\\s+(\\w+)(?=[,)])", replacement: "$1" },
  ],

  // ── 6. כללים ספציפיים לאפליקציה (מהמסמך) ─────────────────
  custom: [
    { label: "this.boxes[x] → arr[x]",       regex: "this\\.boxes\\[",  replacement: "arr[" },
    { label: "this.boxes.length → arr.length",regex: "this\\.boxes\\.length", replacement: "arr.length" },
    { label: "serialSearchByValueChain → customSearch", regex: "serialSearchByValueChain\\(([^)]+)\\)", replacement: "customSearch(arr, $1)" },
  ],
};

let rules = JSON.parse(JSON.stringify(DEFAULT_RULES));

// ============================================================
//  מנוע ההמרה
// ============================================================
function convertJavaToJS(code) {
  let result = code;
  let replacementCount = 0;

  const allRules = [
    ...rules.removals,
    ...rules.types,
    ...rules.functions,
    ...rules.methods,
    ...rules.syntax,
    ...rules.custom,
  ];

  for (const rule of allRules) {
    try {
      const rx = new RegExp(rule.regex, 'g');
      const before = result;
      result = result.replace(rx, rule.replacement);
      if (result !== before) replacementCount++;
    } catch(e) {
      // skip broken regex
    }
  }

  // ── ניקוי שיורי: הסר סוגי Java שנותרו בפרמטרים ──
  result = result.replace(/\b(int|double|float|long|char|byte|short|boolean|String|void)\s+(\w)/g, '$2');

  return { code: result, count: replacementCount };
}

// ============================================================
//  UI Functions
// ============================================================
function convert() {
  const input = document.getElementById('javaInput').value.trim();
  const statusEl = document.getElementById('status');
  const statsEl = document.getElementById('stats');

  if (!input) {
    showStatus('warn', '⚠ אנא הכנס קוד Java להמרה');
    return;
  }

  const { code, count } = convertJavaToJS(input);
  renderOutput(code);

  const lines = code.split('\n').length;
  document.getElementById('statLines').textContent = lines;
  document.getElementById('statReplacements').textContent = count;
  statsEl.style.display = 'flex';

  showStatus('ok', `✓ המרה הושלמה · ${count} שינויים בוצעו`);
}

function renderOutput(code) {
  const el = document.getElementById('jsOutput');
  // Token-based highlighting — never re-run regex on already-generated HTML
  const tokens = [];
  let remaining = code;

  const patterns = [
    { type: 'comment',  rx: /^\/\/[^\n]*/ },
    { type: 'comment',  rx: /^\/\*[\s\S]*?\*\// },
    { type: 'string',   rx: /^"(?:[^"\\]|\\.)*"/ },
    { type: 'string',   rx: /^'(?:[^'\\]|\\.)*'/ },
    { type: 'keyword',  rx: /^(?:function|return|if|else|while|for|let|const|var|throw|new|true|false|null|undefined)\b/ },
    { type: 'number',   rx: /^\d+\.?\d*/ },
    { type: 'plain',    rx: /^[\s\S]/ },  // fallback: one char at a time
  ];

  while (remaining.length > 0) {
    let matched = false;
    for (const { type, rx } of patterns) {
      const m = remaining.match(rx);
      if (m) {
        tokens.push({ type, text: m[0] });
        remaining = remaining.slice(m[0].length);
        matched = true;
        break;
      }
    }
    if (!matched) break; // safety
  }

  const html = tokens.map(({ type, text }) => {
    const safe = escapeHTML(text);
    return type === 'plain' ? safe : `<span class="${type}">${safe}</span>`;
  }).join('');

  el.innerHTML = html;
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function clearInput() {
  document.getElementById('javaInput').value = '';
  document.getElementById('jsOutput').textContent = '// קוד JavaScript יופיע כאן לאחר המרה...';
  document.getElementById('status').className = 'status';
  document.getElementById('stats').style.display = 'none';
}

function copyOutput() {
  const text = document.getElementById('jsOutput').innerText;
  navigator.clipboard.writeText(text).then(() => showStatus('ok', '✓ הועתק ללוח'));
}

function loadExample() {
  document.getElementById('javaInput').value = `public int serialSearchByValueChain(int startIndex) {
  if (startIndex < 0 || startIndex >= this.boxes.length) {
    throw new IllegalArgumentException("Input 'startIndex' is out of array bounds.");
  }
  boolean[] visited = new boolean[this.boxes.length];
  int currentIndex = startIndex;
  int currentValue = this.boxes[currentIndex];
  int searchCount = 0;
  while (currentValue != startIndex && searchCount <= this.boxes.length) {
    if (currentIndex < 0 || currentIndex >= this.boxes.length) {
      System.out.println("Error: Invalid index encountered: " + currentIndex);
      return -1;
    }
    if (visited[currentIndex]) {
      System.out.println("Warning: Infinite loop detected at index " + currentIndex);
      return -1;
    }
    visited[currentIndex] = true;
    currentValue = this.boxes[currentIndex];
    currentIndex = currentValue;
    searchCount++;
  }
  return searchCount;
}`;
  showStatus('warn', '⚠ קוד דוגמה נטען · לחץ "המר" להמרה');
}

// ============================================================
//  Rules Modal
// ============================================================
function openRules() {
  renderRulesModal();
  document.getElementById('rulesPanel').classList.add('open');
}

function closeRules() {
  document.getElementById('rulesPanel').classList.remove('open');
}

function saveAndClose() {
  collectRulesFromModal();
  closeRules();
  showStatus('ok', '✓ כללים נשמרו');
}

function resetRules() {
  rules = JSON.parse(JSON.stringify(DEFAULT_RULES));
  renderRulesModal();
}

function collectRulesFromModal() {
  const sections = ['removals','types','functions','methods','syntax','custom'];
  for (const sec of sections) {
    const rows = document.querySelectorAll(`[data-section="${sec}"]`);
    rules[sec] = [];
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      if (inputs[0].value.trim()) {
        rules[sec].push({ label: '', regex: inputs[0].value, replacement: inputs[1].value });
      }
    });
  }
}

function renderRulesModal() {
  const body = document.getElementById('rulesBody');
  body.innerHTML = '';

  const sections = [
    { key: 'removals',  title: '1. הסרות (אין מקבילה ב-JS)' },
    { key: 'types',     title: '2. המרת סוגי נתונים' },
    { key: 'functions', title: '3. פורמט פונקציות' },
    { key: 'methods',   title: '4. מתודות מובנות' },
    { key: 'syntax',    title: '5. מבני שפה' },
    { key: 'custom',    title: '6. כללים מותאמים לאפליקציה' },
  ];

  for (const sec of sections) {
    const secDiv = document.createElement('div');
    secDiv.className = 'rule-section';
    secDiv.innerHTML = `<div class="rule-section-title">${sec.title}</div>
      <div class="column-labels">
        <div class="col-label">Regex (Java pattern)</div>
        <div class="col-label">Replacement (JS)</div>
        <div class="col-label"></div>
      </div>`;

    const list = document.createElement('div');
    list.style.display = 'flex';
    list.style.flexDirection = 'column';
    list.style.gap = '6px';

    for (const rule of (rules[sec.key] || [])) {
      list.appendChild(buildRuleRow(sec.key, rule.regex, rule.replacement));
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = '+ הוסף כלל';
    addBtn.onclick = () => {
      const row = buildRuleRow(sec.key, '', '');
      list.insertBefore(row, addBtn.parentNode ? null : list.lastChild);
      list.appendChild(row);
    };

    secDiv.appendChild(list);
    secDiv.appendChild(addBtn);
    body.appendChild(secDiv);

    // Store list ref for add button
    addBtn.onclick = () => list.appendChild(buildRuleRow(sec.key, '', ''));
  }
}

function buildRuleRow(section, regex, replacement) {
  const row = document.createElement('div');
  row.className = 'rule-row';
  row.setAttribute('data-section', section);
  row.innerHTML = `
    <input class="rule-input" type="text" value="${escapeAttr(regex)}" placeholder="regex pattern..." dir="ltr">
    <input class="rule-input" type="text" value="${escapeAttr(replacement)}" placeholder="replacement..." dir="ltr">
    <button class="del-btn" onclick="this.parentElement.remove()">✕</button>
  `;
  return row;
}

function escapeAttr(s) {
  return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// Keyboard shortcut: Ctrl+Enter to convert
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') convert();
  if (e.key === 'Escape') closeRules();
});
</script>
